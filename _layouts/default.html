<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | TAHL Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    .article-content h1 { @apply text-4xl md:text-5xl font-black uppercase italic mb-8 leading-none text-gray-900 tracking-tighter; }
    .article-content h2 { @apply text-2xl md:text-3xl font-extrabold mt-12 mb-6 text-blue-900 uppercase tracking-tight border-b-2 border-blue-100 pb-2; }
    .article-content h3 { @apply text-xl md:text-2xl font-bold mt-8 mb-4 text-blue-800; }
    .article-content p { @apply text-lg mb-6 text-gray-800 leading-relaxed; }
    .article-content ul { @apply list-disc list-outside ml-6 mb-6 space-y-2 text-gray-800 text-lg; }
    .article-content li { @apply pl-2; }
    .article-content strong { @apply font-bold text-gray-900; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="bg-blue-900 text-white py-6 shadow-lg">
    <div class="container mx-auto px-4">
      <h1 class="text-3xl font-bold font-mono tracking-tight"><a href="{{ '/' | relative_url }}">CENTER OF THE HOCKEYVERSE</a></h1>
      <p class="text-blue-200 mt-1 uppercase text-sm tracking-widest">The Only Spot in Tulsa where an Echo is a Goal</p>
    </div>
  </header>
  <main class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto article-content">
      {{ content }}
    </div>
  </main>
  <footer class="border-t border-gray-200 py-8 mt-12">
    <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
      &copy; 2026 TAHL Tracker. All rights reserved.
    </div>
  </footer>
</body>
</html>
