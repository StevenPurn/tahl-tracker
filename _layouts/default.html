<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | TAHL Tracker</title>

  <!-- Open Graph / Facebook Previews -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}TAHL Tracker{% endif %}">
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}AI-generated game recaps and articles for the Tulsa Adult Hockey League.{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  
  <!-- Twitter Card Previews -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}TAHL Tracker{% endif %}">
  <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}AI-generated game recaps and articles for the Tulsa Adult Hockey League.{% endif %}">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Static compiled Tailwind CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="bg-blue-900 text-white py-6 shadow-lg">
    <div class="container mx-auto px-4">
      <h1 class="text-3xl font-black uppercase italic tracking-tight"><a href="{{ '/' | relative_url }}">CENTER OF THE HOCKEYVERSE</a></h1>
      <p class="text-blue-200 mt-1 uppercase text-sm tracking-widest">The Only Spot in Tulsa where an Echo is a Goal</p>
    </div>
  </header>
  <main class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto article-content">
      {{ content }}
    </div>
  </main>
  <footer class="border-t border-gray-200 py-8 mt-12">
    <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
      &copy; 2026 TAHL Tracker. All rights reserved.
    </div>
  </footer>
</body>
</html>
